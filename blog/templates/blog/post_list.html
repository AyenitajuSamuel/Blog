{% extends 'blog/base.html' %}
{% block content %}
    <h1>My Blog</h1>
    {% if posts %}
        {% for post in posts %}
            <p><a href="{% url 'post_detail' slug=post.slug %}">{{ post.title }}</a></p>
        {% endfor %}
        <p><a href="{% url 'post_create' %}">Create Post</a></p> 
    {% else%}
        <p>No posts yet.</p>
        <p><a href="{% url 'post_create' %}">Create Post</a></p>  
    {% endif %}
{% endblock %}
